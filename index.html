<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLink - Redirecting...</title>
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        .loader {
            border: 4px solid #DEE2E6;
            border-top: 4px solid #002147;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>

    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        (function () {
            const redirect = (target) => window.location.replace(target);
            let resolved = false;

            const timeoutId = setTimeout(() => {
                if (!resolved) {
                    console.warn('Firebase auth check timed out. Redirecting to login.');
                    redirect('login.html');
                }
            }, 6000);

            const finish = (target) => {
                if (resolved) return;
                resolved = true;
                clearTimeout(timeoutId);
                redirect(target);
            };

            try {
                if (typeof firebaseConfig === 'undefined') {
                    throw new Error('firebaseConfig is not defined. Please make sure firebase-config.js is loaded.');
                }

                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }

                firebase.auth().onAuthStateChanged(user => {
                    finish(user ? 'home.html' : 'login.html');
                });
            } catch (error) {
                console.error('CampusLink redirect bootstrap failed:', error);
                finish('login.html');
            }
        })();
    </script>
</body>
</html>
