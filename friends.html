    <title>CampusLink | CourseMates</title>
    <meta name="description" content="Connect with your CourseMates and study group peers on CampusLink.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="campus-style.css">
    <link rel="shortcut icon" href="icons/logo.svg" type="image/x-icon">
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand navbar-dark fixed-top shadow-sm">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold fs-4 d-flex align-items-center me-3" href="home.html">
                    <img src="icons/logo.svg" alt="CampusLink" style="height: 32px; margin-right: 10px; filter: brightness(0) invert(1);">
                    CampusLink
                </a>
                <div class="input-group search-box d-none d-md-flex">
                    <span class="input-group-text bg-white border-0 opacity-50"><i class="bi bi-search"></i></span>
                    <input type="search" class="form-control bg-white border-0" placeholder="Find CourseMates..." id="globalSearch" style="background: rgba(255,255,255,0.1) !important; color: white;">
                </div>
            </div>
            
            <ul class="navbar-nav mx-auto d-none d-lg-flex">
                <li class="nav-item">
                    <a class="nav-link" href="home.html" title="Campus Feed"><i class="bi bi-house-door-fill fs-5"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="friends.html" title="CourseMates"><i class="bi bi-people-fill fs-5"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="watch.html" title="Lectures"><i class="bi bi-mortarboard-fill fs-5"></i></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="groups.html" title="Study Groups"><i class="bi bi-collection-fill fs-5"></i></a>
                </li>
            </ul>
            
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-link text-white p-2" onclick="window.location.href='messages.html'"><i class="bi bi-chat-dots-fill fs-5"></i></button>
                <div class="dropdown">
                    <button class="btn p-0 ms-2" data-bs-toggle="dropdown">
                        <img src="icons/avatar.svg" class="rounded-circle nav-profile-pic" alt="Profile">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2">
                        <li><a class="dropdown-item py-2" href="profile.html"><i class="bi bi-person-circle me-2"></i> My Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2 text-danger" href="login.html" onclick="auth.signOut()"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid main-content">
        <div class="row">
            <!-- Left Sidebar -->
            <div class="col-lg-3 col-md-4 left-sidebar">
                <div class="card border-0 shadow-sm bg-white rounded-3">
                    <div class="card-body p-3">
                        <h5 class="fw-bold mb-3 px-2">CourseMates</h5>
                        <div class="list-group list-group-flush">
                            <button class="list-group-item list-group-item-action d-flex align-items-center active" onclick="showFriendsSection('requests')">
                                <i class="bi bi-person-fill-add me-3 fs-5"></i> Peer Requests
                                <span class="badge bg-danger rounded-pill ms-auto" id="requestCountBadge" style="display: none;">0</span>
                            </button>
                            <button class="list-group-item list-group-item-action d-flex align-items-center" onclick="showFriendsSection('suggestions')">
                                <i class="bi bi-lightbulb-fill me-3 fs-5"></i> Discover Peers
                            </button>
                            <button class="list-group-item list-group-item-action d-flex align-items-center" onclick="showFriendsSection('all')">
                                <i class="bi bi-people-fill me-3 fs-5"></i> My CourseMates
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-lg-9 col-md-8">
                <!-- Search Results (Dynamic) -->
                <div id="searchSection" style="display: none;" class="mb-4">
                    <h5 class="fw-bold mb-3 d-flex align-items-center">
                        <i class="bi bi-search me-2 text-primary"></i> Search Results
                    </h5>
                    <div class="row g-3" id="searchResultsGrid">
                        <!-- Search results will be injected here -->
                    </div>
                    <hr class="my-4 opacity-5">
                </div>

                <!-- Friend Requests -->
                <div class="section-container" id="requestsSection">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4 d-flex align-items-center">
                                <i class="bi bi-person-plus-fill me-2 text-primary"></i> Pending Peer Requests
                            </h5>
                            <div class="row g-3" id="friendRequestsGrid">
                                <!-- Friend requests will be loaded here -->
                                <div class="col-12 text-center py-5" id="noRequestsMsg">
                                    <i class="bi bi-person-check fs-1 text-muted opacity-25 d-block mb-3"></i>
                                    <p class="text-muted mb-0">No pending peer requests at the moment.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Suggestions / People You May Know -->
                <div class="section-container" id="suggestionsSection">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4 d-flex align-items-center">
                                <i class="bi bi-stars me-2 text-warning"></i> Recommended Peers
                            </h5>
                            <div class="row g-3" id="suggestionsGrid">
                                <!-- Suggestions will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- All Friends -->
                <div class="section-container" id="allFriendsSection" style="display: none;">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4 d-flex align-items-center">
                                <i class="bi bi-people-fill me-2 text-info"></i> Your CourseMates
                            </h5>
                            <div class="row g-3" id="allFriendsGrid">
                                <!-- All friends will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="core.js"></script>
    <script>
        function initCampusLink(userData) {
            document.querySelectorAll('.nav-profile-pic').forEach(img => img.src = userData.profilePic || userData.photoURL || 'icons/avatar.svg');
            
            loadFriendRequests();
            loadSuggestions();
            loadAllFriends();
        }

        window.addEventListener('campuslink_auth_ready', (e) => initCampusLink(e.detail));
        if (typeof auth !== 'undefined' && auth.currentUser) {
            db.ref('users/' + auth.currentUser.uid).once('value').then(snap => { if (snap.exists()) initCampusLink(snap.val()); });
        }

        // Section Switching
        function showFriendsSection(sectionId) {
            document.querySelectorAll('.section-container').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.list-group-item').forEach(i => i.classList.remove('active'));
            
            if (sectionId === 'requests') {
                document.getElementById('requestsSection').style.display = 'block';
                document.getElementById('suggestionsSection').style.display = 'block';
            } else if (sectionId === 'suggestions') {
                document.getElementById('suggestionsSection').style.display = 'block';
            } else if (sectionId === 'all') {
                document.getElementById('allFriendsSection').style.display = 'block';
            }
            
            event.currentTarget.classList.add('active');
        }

        // Search Logic
        document.getElementById('globalSearch').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (query.length < 2) {
                document.getElementById('searchSection').style.display = 'none';
                return;
            }

            db.ref('users').once('value', snapshot => {
                const resultsGrid = document.getElementById('searchResultsGrid');
                resultsGrid.innerHTML = '';
                let found = false;

                snapshot.forEach(child => {
                    const user = child.val();
                    if (child.key !== currentUser.uid && (user.name.toLowerCase().includes(query) || user.email.toLowerCase().includes(query))) {
                        const col = createUserCard(child.key, user, 'search');
                        resultsGrid.appendChild(col);
                        found = true;
                    }
                });

                document.getElementById('searchSection').style.display = found ? 'block' : 'none';
            });
        });

        function loadFriendRequests() {
            db.ref('friendRequests/' + currentUser.uid).on('value', snapshot => {
                const grid = document.getElementById('friendRequestsGrid');
                const badge = document.getElementById('requestCountBadge');
                grid.innerHTML = '';
                
                let count = 0;
                snapshot.forEach(child => {
                    const request = child.val();
                    if (request.status === 'received') {
                        count++;
                        db.ref('users/' + child.key).once('value', uSnap => {
                            const u = uSnap.val();
                            const col = createUserCard(child.key, u, 'request');
                            grid.appendChild(col);
                            document.getElementById('noRequestsMsg').style.display = 'none';
                        });
                    }
                });

                if (count > 0) {
                    badge.textContent = count;
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                    grid.innerHTML = '<div class="col-12 text-center py-4"><p class="text-muted">No pending peer requests.</p></div>';
                }
            });
        }

        function loadSuggestions() {
            db.ref('users').limitToLast(12).once('value', snapshot => {
                const grid = document.getElementById('suggestionsGrid');
                grid.innerHTML = '';
                snapshot.forEach(child => {
                    if (child.key !== currentUser.uid) {
                        // Check if already friends or requested
                        db.ref(`friends/${currentUser.uid}/${child.key}`).once('value', fSnap => {
                            if (!fSnap.exists()) {
                                const col = createUserCard(child.key, child.val(), 'suggestion');
                                grid.appendChild(col);
                            }
                        });
                    }
                });
            });
        }

        function loadAllFriends() {
            db.ref('friends/' + currentUser.uid).on('value', snapshot => {
                const grid = document.getElementById('allFriendsGrid');
                grid.innerHTML = '';
                snapshot.forEach(child => {
                    db.ref('users/' + child.key).once('value', uSnap => {
                        const col = createUserCard(child.key, uSnap.val(), 'friend');
                        grid.appendChild(col);
                    });
                });
            });
        }

        function createUserCard(uid, user, type) {
            const col = document.createElement('div');
            col.className = 'col-lg-3 col-md-6';
            const pic = user.profilePic || user.photoURL || 'icons/avatar.svg';
            
            let buttons = '';
            if (type === 'request') {
                buttons = `
                    <button class="btn btn-primary w-100 mb-2" onclick="confirmFriend('${uid}')">Confirm</button>
                    <button class="btn btn-light border w-100" onclick="deleteRequest('${uid}')">Decline</button>
                `;
            } else if (type === 'suggestion' || type === 'search') {
                buttons = `<button class="btn btn-primary w-100" onclick="sendFriendRequest('${uid}')"><i class="bi bi-person-plus-fill me-2"></i>Connect</button>`;
            } else if (type === 'friend') {
                buttons = `<button class="btn btn-outline-primary w-100" onclick="window.location.href='messages.html?chat=${uid}'"><i class="bi bi-chat-dots-fill me-2"></i>Message</button>`;
            }

            col.innerHTML = `
                <div class="card h-100 border-0 shadow-sm transition">
                    <img src="${pic}" class="card-img-top object-fit-cover rounded-top" style="height: 180px;" alt="User">
                    <div class="card-body text-center">
                        <h6 class="fw-bold mb-1 text-truncate">${user.name}</h6>
                        <p class="text-muted small mb-3">Student</p>
                        ${buttons}
                    </div>
                </div>
            `;
            return col;
        }

        async function sendFriendRequest(targetUid) {
            await db.ref(`friendRequests/${targetUid}/${currentUser.uid}`).set({ status: 'received', timestamp: firebase.database.ServerValue.TIMESTAMP });
            await db.ref(`friendRequests/${currentUser.uid}/${targetUid}`).set({ status: 'sent', timestamp: firebase.database.ServerValue.TIMESTAMP });
            showToast('Connection request sent!', 'success');
        }

        async function confirmFriend(targetUid) {
            const now = firebase.database.ServerValue.TIMESTAMP;
            await db.ref(`friends/${currentUser.uid}/${targetUid}`).set(now);
            await db.ref(`friends/${targetUid}/${currentUser.uid}`).set(now);
            await db.ref(`friendRequests/${currentUser.uid}/${targetUid}`).remove();
            await db.ref(`friendRequests/${targetUid}/${currentUser.uid}`).remove();
            showToast('You are now connected!', 'success');
        }

        async function deleteRequest(targetUid) {
            await db.ref(`friendRequests/${currentUser.uid}/${targetUid}`).remove();
            await db.ref(`friendRequests/${targetUid}/${currentUser.uid}`).remove();
            showToast('Request declined', 'info');
        }
    </script>
</body>
</html>
