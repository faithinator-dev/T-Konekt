<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLink | Direct Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="campus-style.css">
    <link rel="shortcut icon" href="icons/logo.svg" type="image/x-icon">
    <style>
        .chat-window { height: calc(100vh - 65px); }
        .messages-container { height: calc(100vh - 220px); overflow-y: auto; display: flex; flex-direction: column; background: #f8f9fa; }
        .message-bubble { max-width: 75%; padding: 10px 16px; border-radius: 12px; margin-bottom: 10px; position: relative; font-size: 0.95rem; line-height: 1.4; }
        .message-sent { background: var(--primary-blue); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message-received { background: white; color: var(--text-dark); align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: var(--shadow-sm); }
        .chat-item.active { background: rgba(0, 123, 255, 0.08); border-left: 4px solid var(--primary-blue); }
        .chat-list-container { height: calc(100vh - 65px); overflow-y: auto; border-right: 1px solid #eee; }
    </style>
</head>
<body class="bg-white">
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand navbar-dark fixed-top shadow-sm">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold fs-4 d-flex align-items-center me-3" href="home.html">
                    <img src="icons/logo.svg" alt="CampusLink" style="height: 32px; margin-right: 10px; filter: brightness(0) invert(1);">
                    CampusLink
                </a>
            </div>
            
            <ul class="navbar-nav mx-auto d-none d-lg-flex">
                <li class="nav-item"><a class="nav-link" href="home.html" title="Campus Feed"><i class="bi bi-house-door-fill fs-5"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="friends.html" title="CourseMates"><i class="bi bi-people-fill fs-5"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="watch.html" title="Lectures"><i class="bi bi-mortarboard-fill fs-5"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="groups.html" title="Study Groups"><i class="bi bi-collection-fill fs-5"></i></a></li>
            </ul>
            
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-link text-white p-2 active"><i class="bi bi-chat-dots-fill fs-5"></i></button>
                <div class="dropdown">
                    <button class="btn p-0 ms-2" data-bs-toggle="dropdown">
                        <img src="icons/avatar.svg" class="rounded-circle nav-profile-pic" alt="Profile">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2">
                        <li><a class="dropdown-item py-2" href="profile.html"><i class="bi bi-person-circle me-2"></i> My Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2 text-danger" href="login.html" onclick="auth.signOut()"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid p-0" style="margin-top: 65px;">
        <div class="row g-0">
            <!-- Sidebar: Chat List -->
            <div class="col-lg-3 col-md-4 chat-list-container bg-white">
                <div class="p-4 border-bottom">
                    <h4 class="fw-bold mb-3">Messages</h4>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
                        <input type="search" class="form-control bg-light border-0" placeholder="Search CourseMates...">
                    </div>
                </div>
                <div id="chatList" class="list-group list-group-flush">
                    <!-- Chats will be injected here -->
                    <div class="text-center py-5"><div class="spinner-border text-primary spinner-border-sm"></div></div>
                </div>
            </div>

            <!-- Main: Chat Window -->
            <div class="col-lg-9 col-md-8 bg-white d-flex flex-column chat-window">
                <div id="noChatSelected" class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-center p-5 bg-light">
                    <div class="bg-white rounded-circle shadow-sm p-4 mb-4">
                        <i class="bi bi-chat-dots text-primary opacity-25" style="font-size: 4rem;"></i>
                    </div>
                    <h4 class="fw-bold">Your Messages</h4>
                    <p class="text-muted">Select a CourseMate from the left to start a private discussion.</p>
                    <button class="btn btn-primary fw-bold mt-2 px-4" onclick="window.location.href='friends.html'">Find CourseMates</button>
                </div>

                <div id="activeChat" style="display: none;" class="flex-grow-1 d-flex flex-column">
                    <!-- Chat Header -->
                    <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-white shadow-sm z-1">
                        <div class="d-flex align-items-center">
                            <div class="position-relative">
                                <img src="icons/avatar.svg" class="rounded-circle me-3 border" id="activeChatPic" width="45" height="45">
                                <span class="position-absolute bottom-0 end-0 bg-success border border-2 border-white rounded-circle" style="width: 12px; height: 12px; margin-right: 15px;"></span>
                            </div>
                            <div>
                                <h6 class="fw-bold mb-0" id="activeChatName">User Name</h6>
                                <div class="small text-muted" id="activeChatStatus">Student Member</div>
                            </div>
                        </div>
                        <div class="d-flex gap-1">
                            <button class="btn btn-light btn-sm rounded-circle p-2"><i class="bi bi-telephone-fill text-primary"></i></button>
                            <button class="btn btn-light btn-sm rounded-circle p-2"><i class="bi bi-camera-video-fill text-primary"></i></button>
                            <button class="btn btn-light btn-sm rounded-circle p-2"><i class="bi bi-info-circle-fill text-primary"></i></button>
                        </div>
                    </div>

                    <!-- Messages Area -->
                    <div class="messages-container p-4" id="messagesList">
                        <!-- Messages will be injected here -->
                    </div>

                    <!-- Message Input -->
                    <div class="p-3 border-top bg-white">
                        <form id="messageForm" class="d-flex gap-3 align-items-center container-fluid">
                            <div class="d-flex gap-1">
                                <button type="button" class="btn btn-light rounded-circle"><i class="bi bi-plus-lg text-primary"></i></button>
                                <button type="button" class="btn btn-light rounded-circle"><i class="bi bi-image text-primary"></i></button>
                            </div>
                            <div class="flex-grow-1">
                                <input type="text" class="form-control rounded-pill py-2 px-4 border-0 bg-light" placeholder="Type a message..." id="messageInput" autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary rounded-circle p-2 px-3"><i class="bi bi-send-fill"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="core.js"></script>
    <script>
        let activeRecipientId = null;
        let activeChatId = null;

        function initCampusLink(userData) {
            document.querySelectorAll('.nav-profile-pic').forEach(img => img.src = userData.profilePic || userData.photoURL || 'icons/avatar.svg');
            loadChatList();
            
            const urlParams = new URLSearchParams(window.location.search);
            const chatUid = urlParams.get('chat');
            if (chatUid) openChat(chatUid);
        }

        window.addEventListener('campuslink_auth_ready', (e) => initCampusLink(e.detail));
        if (typeof auth !== 'undefined' && auth.currentUser) {
            db.ref('users/' + auth.currentUser.uid).once('value').then(snap => { if (snap.exists()) initCampusLink(snap.val()); });
        }

        function loadChatList() {
            db.ref('friends/' + currentUser.uid).on('value', snapshot => {
                const list = document.getElementById('chatList');
                list.innerHTML = '';
                
                if (!snapshot.exists()) {
                    list.innerHTML = '<div class="p-5 text-center"><p class="text-muted small">No CourseMates connected yet.</p></div>';
                    return;
                }

                snapshot.forEach(child => {
                    db.ref('users/' + child.key).once('value', uSnap => {
                        const user = uSnap.val();
                        if (user) {
                            const item = document.createElement('button');
                            item.className = 'list-group-item list-group-item-action border-0 d-flex align-items-center p-3 chat-item';
                            item.id = `chat-item-${child.key}`;
                            item.onclick = () => openChat(child.key);
                            
                            item.innerHTML = `
                                <img src="${user.profilePic || user.photoURL || 'icons/avatar.svg'}" class="rounded-circle me-3 border" width="48" height="48">
                                <div class="flex-grow-1 overflow-hidden">
                                    <div class="d-flex justify-content-between">
                                        <strong class="text-truncate">${user.name}</strong>
                                    </div>
                                    <div class="text-muted small text-truncate">Academic collaboration...</div>
                                </div>
                            `;
                            list.appendChild(item);
                        }
                    });
                });
            });
        }

        async function openChat(recipientId) {
            activeRecipientId = recipientId;
            activeChatId = currentUser.uid < recipientId ? `${currentUser.uid}_${recipientId}` : `${recipientId}_${currentUser.uid}`;
            
            document.getElementById('noChatSelected').style.display = 'none';
            document.getElementById('activeChat').style.display = 'flex';
            document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
            const item = document.getElementById(`chat-item-${recipientId}`);
            if (item) item.classList.add('active');

            const uSnap = await db.ref('users/' + recipientId).once('value');
            const user = uSnap.val();
            document.getElementById('activeChatName').textContent = user.name;
            document.getElementById('activeChatPic').src = user.profilePic || user.photoURL || 'icons/avatar.svg';
            document.getElementById('activeChatStatus').textContent = user.major ? `${user.major} Student` : 'Student Member';

            loadMessages(activeChatId);
        }

        function loadMessages(chatId) {
            const list = document.getElementById('messagesList');
            db.ref('chats/' + chatId).off();
            db.ref('chats/' + chatId).on('value', snapshot => {
                list.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val();
                    const isSent = msg.senderId === currentUser.uid;
                    const div = document.createElement('div');
                    div.className = `message-bubble ${isSent ? 'message-sent' : 'message-received'}`;
                    div.textContent = msg.text;
                    list.appendChild(div);
                });
                list.scrollTop = list.scrollHeight;
            });
        }

        document.getElementById('messageForm').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            await db.ref('chats/' + activeChatId).push({
                senderId: currentUser.uid,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            input.value = '';
        };
    </script>
</body>
</html>
