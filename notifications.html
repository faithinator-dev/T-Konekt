<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLink | Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="campus-style.css">
    <link rel="shortcut icon" href="icons/logo.svg" type="image/x-icon">
    <style>
        .notification-item { transition: var(--transition); border-left: 4px solid transparent; }
        .notification-item:hover { background-color: rgba(0, 123, 255, 0.02) !important; }
        .notification-unread { border-left-color: var(--primary-blue); background-color: rgba(0, 123, 255, 0.05) !important; }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand navbar-dark fixed-top shadow-sm">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <a class="navbar-brand fw-bold fs-4 d-flex align-items-center me-3" href="home.html">
                    <img src="icons/logo.svg" alt="CampusLink" style="height: 32px; margin-right: 10px; filter: brightness(0) invert(1);">
                    CampusLink
                </a>
            </div>
            
            <ul class="navbar-nav mx-auto d-none d-lg-flex">
                <li class="nav-item"><a class="nav-link" href="home.html" title="Campus Feed"><i class="bi bi-house-door-fill fs-5"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="friends.html" title="Classmates"><i class="bi bi-people-fill fs-5"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="watch.html" title="Lectures"><i class="bi bi-mortarboard-fill fs-5"></i></a></li>
                <li class="nav-item"><a class="nav-link" href="groups.html" title="Study Groups"><i class="bi bi-collection-fill fs-5"></i></a></li>
            </ul>
            
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-link text-white p-2" onclick="window.location.href='messages.html'"><i class="bi bi-chat-dots-fill fs-5"></i></button>
                <div class="dropdown">
                    <button class="btn p-0 ms-2" data-bs-toggle="dropdown">
                        <img src="https://via.placeholder.com/40" class="rounded-circle nav-profile-pic" alt="Profile">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2">
                        <li><a class="dropdown-item py-2" href="profile.html"><i class="bi bi-person-circle me-2"></i> My Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2 text-danger" href="login.html" onclick="auth.signOut()"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-content" style="padding-top: 40px;">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-4 px-4 border-bottom">
                        <h4 class="mb-0 fw-bold">Campus Notifications</h4>
                        <button class="btn btn-light btn-sm fw-bold px-3" onclick="markAllAsRead()">Mark all as read</button>
                    </div>
                    <div class="card-body p-0">
                        <div id="notificationsList">
                            <!-- Notifications will be loaded here -->
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="core.js"></script>
    <script>
        function initCampusLink(userData) {
            document.querySelectorAll('.nav-profile-pic').forEach(img => img.src = userData.profilePic || userData.photoURL || 'https://via.placeholder.com/150');
            loadNotifications();
        }

        window.addEventListener('campuslink_auth_ready', (e) => initCampusLink(e.detail));
        if (typeof auth !== 'undefined' && auth.currentUser) {
            db.ref('users/' + auth.currentUser.uid).once('value').then(snap => { if (snap.exists()) initCampusLink(snap.val()); });
        }

        function loadNotifications() {
            const list = document.getElementById('notificationsList');
            
            db.ref('friendRequests/' + currentUser.uid).on('value', requestSnap => {
                db.ref('notifications/' + currentUser.uid).on('value', activitySnap => {
                    list.innerHTML = '';
                    const allNotifications = [];

                    requestSnap.forEach(child => {
                        const req = child.val();
                        if (req.status === 'received') {
                            allNotifications.push({
                                id: 'req_' + child.key,
                                type: 'friend_request',
                                userId: child.key,
                                timestamp: req.timestamp,
                                read: false
                            });
                        }
                    });

                    activitySnap.forEach(child => {
                        allNotifications.push({ id: child.key, ...child.val() });
                    });

                    allNotifications.sort((a, b) => b.timestamp - a.timestamp);

                    if (allNotifications.length === 0) {
                        list.innerHTML = `
                            <div class="text-center py-5 text-muted">
                                <i class="bi bi-bell-slash fs-1 opacity-25 d-block mb-3"></i>
                                <p class="mb-0">No new campus updates.</p>
                            </div>
                        `;
                        return;
                    }

                    allNotifications.forEach(notif => {
                        renderNotification(notif, list);
                    });
                });
            });
        }

        async function renderNotification(notif, container) {
            const userSnap = await db.ref('users/' + notif.userId).once('value');
            const user = userSnap.val() || { name: 'Student', profilePic: 'https://via.placeholder.com/150' };
            const pic = user.profilePic || user.photoURL || 'https://via.placeholder.com/150';
            
            let message = '';
            let icon = '';
            let link = '#';

            if (notif.type === 'friend_request') {
                message = `<strong>${user.name}</strong> wants to connect with you.`;
                icon = 'bi-person-plus-fill text-primary';
                link = 'friends.html';
            } else if (notif.type === 'like') {
                message = `<strong>${user.name}</strong> liked your campus post.`;
                icon = 'bi-hand-thumbs-up-fill text-primary';
                link = 'home.html';
            } else if (notif.type === 'comment') {
                message = `<strong>${user.name}</strong> commented on your study tip.`;
                icon = 'bi-chat-fill text-success';
                link = 'home.html';
            }

            const item = document.createElement('div');
            item.className = `notification-item p-4 border-bottom d-flex align-items-center ${notif.read ? '' : 'notification-unread'}`;
            item.innerHTML = `
                <div class="me-4 position-relative">
                    <img src="${pic}" class="rounded-circle border" width="56" height="56">
                    <div class="position-absolute bottom-0 end-0 bg-white rounded-circle shadow-sm p-1" style="transform: translate(25%, 25%); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;">
                        <i class="bi ${icon} x-small" style="font-size: 0.75rem;"></i>
                    </div>
                </div>
                <div class="flex-grow-1" onclick="window.location.href='${link}'" style="cursor: pointer;">
                    <p class="mb-1 text-dark">${message}</p>
                    <small class="text-muted fw-bold">${formatTimestamp(notif.timestamp)}</small>
                </div>
                <div class="dropdown">
                    <button class="btn btn-sm btn-light rounded-circle" data-bs-toggle="dropdown"><i class="bi bi-three-dots"></i></button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0">
                        <li><button class="dropdown-item py-2" onclick="deleteNotification('${notif.id}')"><i class="bi bi-trash me-2"></i>Delete</button></li>
                    </ul>
                </div>
            `;
            container.appendChild(item);
        }

        async function deleteNotification(id) {
            if (id.startsWith('req_')) {
                const targetUid = id.replace('req_', '');
                await db.ref(`friendRequests/${currentUser.uid}/${targetUid}`).remove();
                await db.ref(`friendRequests/${targetUid}/${currentUser.uid}`).remove();
            } else {
                await db.ref(`notifications/${currentUser.uid}/${id}`).remove();
            }
            showToast('Update removed', 'info');
        }

        async function markAllAsRead() {
            const snap = await db.ref('notifications/' + currentUser.uid).once('value');
            const updates = {};
            snap.forEach(child => { updates[`notifications/${currentUser.uid}/${child.key}/read`] = true; });
            await db.ref().update(updates);
            showToast('Notifications updated', 'success');
        }
    </script>
</body>
</html>
